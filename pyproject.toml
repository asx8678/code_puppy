[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast-puppy"
version = "0.4.1"
description = "Code generation agent"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-ai-slim[openai,anthropic,mcp]==1.56.0",
    "typer>=0.12.0",
    "mcp>=1.9.4",
    "httpx[http2]>=0.24.1",
    "requests>=2.28.0",
    "rich>=13.4.2",
    "pydantic>=2.13",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.52",
    "json-repair>=0.46.2",
    "pyfiglet>=0.8.post1",
    "rapidfuzz>=3.13.0",
    "openai>=1.99.1",
    "ripgrep==14.1.0",
    "playwright>=1.40.0",
    "termflow-md>=0.1.11",
    "Pillow>=10.0.0",
    "azure-identity>=1.15.0",
    "anthropic==0.79.0",
    "boto3>=1.43.9",
]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15",
    "pexpect>=4.9.0",
]
authors = [
    {name = "Michael Pfaffenberger"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35.0"]

[project.urls]
repository = "https://github.com/asx8678/code_puppy"
HomePage = "https://github.com/asx8678/code_puppy"


[project.scripts]
fast-puppy = "code_puppy.main:main_entry"
pup = "code_puppy.main:main_entry"

[tool.logfire]
ignore_no_config = true

[tool.hatch.build]
packages = ["code_puppy"]

[tool.hatch.build.targets.wheel.shared-data]
"code_puppy/models.json" = "code_puppy/models.json"
"code_puppy/models_dev_api.json" = "code_puppy/models_dev_api.json"

[[tool.hatch.build.targets.sdist.include]]
path = "code_puppy/models.json"

[[tool.hatch.build.targets.sdist.include]]
path = "code_puppy/models_dev_api.json"
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# E4/E7/E9/F: ruff's default lint baseline (what CI checked before). I: import
# sorting (also enforces the required `from __future__ import annotations` below).
# UP: pyupgrade (PEP 585/604 typing modernization — the core of the sweep).
# E501 (line-too-long) is intentionally NOT enforced — `ruff format` owns line
# length. Not enabling PTH (no autofix, huge noisy report). B/C4/SIM deferred to a
# later cleanup so this sweep stays "typing + imports" rather than logic rewrites.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# UP042 (str+Enum -> StrEnum) changes str()/format output, which the messaging
# renderers depend on; deferred as a behavioral change. UP047 (PEP 695 generics)
# is a single-occurrence semantic syntax shift, deferred to a focused follow-up.
# UP037 (de-quote annotations) is unsafe for forward references in runtime-
# evaluated positions (module/class variable annotations, decorator-time tool
# signatures) in files without `from __future__ import annotations`; its only
# benefit is cosmetic, so it is disabled to avoid NameErrors at import time.
ignore = ["UP042", "UP047", "UP037"]

[tool.ruff.lint.per-file-ignores]
# E402: deliberate deferred/ordered imports. I001: don't let isort reorder the
# ordered import blocks in these files (import side-effects depend on order).
"code_puppy/main.py" = ["E402", "I001"]
"code_puppy/cli_runner.py" = ["E402", "I001"]
"code_puppy/messaging/__init__.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
# Require `from __future__ import annotations` in every module. This makes all
# annotations lazy (PEP 563 strings), which is what makes the PEP 604 (`X | None`)
# and PEP 585 (`list[...]`) rewrites safe even in runtime-evaluated annotation
# positions (singletons, function defaults, pydantic models) — otherwise
# `"ForwardRef" | None` raises TypeError at import time on the target interpreter.
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
addopts = "--cov=code_puppy --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["code_puppy/main.py"]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15",
    "pexpect>=4.9.0",
]
